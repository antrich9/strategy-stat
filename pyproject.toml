[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["edge_config"]

[project]
name = "edge-ledger"
version = "0.1.0"
description = "Robustness testing for systematic trading research: experiment tracking, duplicate grouping and overfitting checks."
readme = "README.md"
license = { text = "MPL-2.0" }
authors = [{ name = "Anton Richardson" }]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
extend-exclude = ["pine_translated", "pine_templates"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
