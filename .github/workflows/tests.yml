name: tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint (syntax errors and undefined names)
        run: ruff check edge_config.py tests output/*.py batch_backtest.py cached_backtest.py tv_pipeline.py simulate_standardized.py pine_translator.py
      - name: Test
        run: pytest -q
